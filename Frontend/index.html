<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var prefs = JSON.parse(localStorage.getItem("elexoplus_preferences"));
          if (prefs) {
            document.documentElement.setAttribute("data-theme", prefs.theme || "dark");
            document.documentElement.setAttribute("data-font-size", prefs.fontSize || "medium");
          } else {
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.setAttribute("data-font-size", "medium");
          }
        } catch(e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.setAttribute("data-font-size", "medium");
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElexoPlus - Employee Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
